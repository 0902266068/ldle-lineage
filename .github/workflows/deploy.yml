name: Deploy mobile game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the public game files
        run: git clone --depth 1 https://github.com/pp771007/idle-lineage-class.git upstream

      - name: Add the personal admin console
        run: |
          mkdir _site
          rsync -a --exclude=.git upstream/ _site/
          cp admin.js _site/admin.js
          cp multiplayer.js _site/multiplayer.js
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '_site/js/01-drops-config.js';
          let source = readFileSync(path, 'utf8');
          if (!source.includes('let _showMobHp = false;')) throw new Error('Could not locate monster HP bar default');
          source = source.replace('let _showMobHp = false;', 'let _showMobHp = true;');
          writeFileSync(path, source);
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '_site/js/03-combat-core.js';
          let source = readFileSync(path, 'utf8');
          const before = 'if (!state || state._pStunCycle || player.dead) return;';
          if (!source.includes(before)) throw new Error('Could not locate player hitstun guard');
          source = source.replace(before, "if (!state || state._pStunCycle || player.dead || (player.buffs && player.buffs.speedStage3 > 0)) return;");
          writeFileSync(path, source);
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '_site/js/05-kill-progression.js';
          let source = readFileSync(path, 'utf8');
          const anchor = '    // === 怪物專屬掉落（依「怪物掉落資料.md」）：每樣物品各自獨立判定一次 ===';
          if (!source.includes(anchor)) throw new Error('Could not locate generic monster drop settlement');
          const addition = [
            '    // 全地圖怪物低機率額外掉落三階段加速或隨機經驗藥水。',
            "    if (!_kbNoReward && !mob.trollPlayer && !mob.siegeV2 && mob.race !== '建築' && mob.race !== '血盟') {",
            "        if (Math.random() < partyDropRate(0.005)) { gainItem('potion_speed_stage3', 1); logSys(\"<span class='text-cyan-300 font-bold'>✦ 你從怪物身上拾起了三階段加速藥水。</span>\"); }",
            "        if (Math.random() < partyDropRate(0.005)) {",
            "            const _expPotions = ['potion_exp150','potion_exp200','potion_exp300','potion_exp500','potion_exp_stage2','potion_exp_stage2_200','potion_exp_stage2_300','potion_exp_stage2_500'];",
            "            const _expPotion = _expPotions[Math.floor(Math.random() * _expPotions.length)];",
            "            if (DB.items[_expPotion]) { gainItem(_expPotion, 1); logSys(\"<span class='text-emerald-300 font-bold'>✦ 你從怪物身上拾起了隨機經驗藥水。</span>\"); }",
            '        }',
            '    }',
            ''
          ].join(String.fromCharCode(10));
          source = source.replace(anchor, addition + anchor);
          writeFileSync(path, source);
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '_site/js/07-skills-cast.js';
          let source = readFileSync(path, 'utf8');
          const start = source.indexOf('    // 轉換魔法（妖精／法師下拉');
          const cast = source.indexOf('        if(hpPct > th && player.mp < player.mmp * 0.9) castSkill(convId);', start);
          const heal = source.indexOf("    let healSk = document.getElementById('sel-heal-skill').value;");
          if (start < 0 || cast < 0 || heal < 0) {
            throw new Error('Could not locate automatic conversion and heal checks in upstream skills script');
          }
          let end = source.indexOf('\n    }', cast);
          if (end < 0) end = source.indexOf('\r\n    }', cast);
          if (end < 0) throw new Error('Could not locate automatic conversion block end');
          end += source.startsWith('\r\n', end) ? 7 : 6;
          let block = source.slice(start, end);
          const defaultGate = 'if(hpPct > th && player.mp < player.mmp * 0.9) castSkill(convId);';
          const configurableGate = "let mpThEl = document.getElementById('set-mp-convert');\n        let mpTh = mpThEl ? Math.max(0, Math.min(100, parseFloat(mpThEl.value) || 0)) : 90;\n        if(hpPct > th && player.mp < player.mmp * (mpTh / 100)) castSkill(convId);";
          if (!block.includes(defaultGate)) throw new Error('Could not locate default conversion MP threshold');
          block = block.replace(defaultGate, configurableGate);
          source = source.slice(0, start) + source.slice(end);
          const newHeal = source.indexOf("    let healSk = document.getElementById('sel-heal-skill').value;");
          block = block.replace('MP 達 90% 以上不轉換；', 'MP 達 90% 以上不轉換；先於自動治癒檢查。');
          source = source.slice(0, newHeal) + block + '\n\n' + source.slice(newHeal);
          const towerGuard = ' && !state.prideClimb';
          if (!source.includes(towerGuard)) throw new Error('Could not locate Tower auto-teleport exclusion');
          source = source.replace(towerGuard, '');
          source = source.replace('；🗼 傲慢之塔攀登中不自動瞬移；', '；奧塔王怪允許自動瞬移；');
          writeFileSync(path, source);
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = '_site/index.html';
          let html = readFileSync(path, 'utf8');
          const pos = html.toLowerCase().lastIndexOf('</body>');
          if (pos < 0) throw new Error('Could not find </body> in upstream index.html');
          const scripts = ['admin.js', 'multiplayer.js']
            .filter(file => !html.includes(file))
            .map(file => '    <script src="./' + file + '?v=' + process.env.GITHUB_SHA + '"></script>')
            .join(String.fromCharCode(10)) + String.fromCharCode(10);
          html = html.slice(0, pos) + scripts + html.slice(pos);
          writeFileSync(path, html);
          NODE

      - name: Build the separate refreshed site
        run: |
          mkdir -p _site/new
          cat xiaoshu-archive-*.b64 | base64 -d > /tmp/xiaoshu-site.zip
          unzip -q /tmp/xiaoshu-site.zip -d /tmp/xiaoshu-site
          rsync -a /tmp/xiaoshu-site/xiaoshu-site-main/ _site/new/
          sed -i 's#https://test.xiaoshu.gg/play/#game/#g' _site/new/index.html _site/new/nav.js
          rm -f _site/new/CNAME
          mkdir -p _site/new/game
          rsync -a --exclude=.git upstream/ _site/new/game/
          cp admin.js _site/new/game/admin.js
          cp multiplayer.js _site/new/game/multiplayer.js
          cp xiaoshu-immersion.js _site/new/game/xiaoshu-immersion.js
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const indexPath = '_site/new/game/index.html';
          const landingPath = '_site/new/index.html';
          let landing = readFileSync(landingPath, 'utf8');
          landing = landing.replace('<script src="nav.js"></script>', '<script src="nav.js?v=' + process.env.GITHUB_SHA + '"></script>');
          writeFileSync(landingPath, landing);
          let html = readFileSync(indexPath, 'utf8');
          const end = html.toLowerCase().lastIndexOf('</body>');
          if (end < 0) throw new Error('Could not locate new game body end');
          if (!html.includes('./admin.js')) html = html.slice(0, end) + '    <script src="./admin.js?v=' + process.env.GITHUB_SHA + '"></script>' + String.fromCharCode(10) + html.slice(end);
          html = html.slice(0, html.toLowerCase().lastIndexOf('</body>')) + '    <script src="./xiaoshu-immersion.js?v=' + process.env.GITHUB_SHA + '"></script>' + String.fromCharCode(10) + html.slice(html.toLowerCase().lastIndexOf('</body>'));
          writeFileSync(indexPath, html);
          writeFileSync(indexPath, html);
          const patch = (path, before, after) => {
            let source = readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error('Missing expected patch anchor in ' + path);
            writeFileSync(path, source.replace(before, after));
          };
          patch('_site/new/game/js/01-drops-config.js', 'let _showMobHp = false;', 'let _showMobHp = true;');
          patch('_site/new/game/js/03-combat-core.js', 'if (!state || state._pStunCycle || player.dead) return;', 'if (!state || state._pStunCycle || player.dead || (player.buffs && player.buffs.speedStage3 > 0)) return;');
          const dropPath = '_site/new/game/js/05-kill-progression.js';
          let drops = readFileSync(dropPath, 'utf8');
          const dropAnchor = '    // === 怪物專屬掉落';
          const at = drops.indexOf(dropAnchor);
          if (at < 0) throw new Error('Could not locate generic drop settlement');
          const extra = [
            '    // 全地圖怪物低機率額外掉落三階段加速或隨機經驗藥水。',
            "    if (!_kbNoReward && !mob.trollPlayer && !mob.siegeV2 && mob.race !== '建築' && mob.race !== '血盟') {",
            "        if (Math.random() < partyDropRate(0.005)) { gainItem('potion_speed_stage3', 1); logSys(\"<span class='text-cyan-300 font-bold'>✦ 你從怪物身上拾起了三階段加速藥水。</span>\"); }",
            "        if (Math.random() < partyDropRate(0.005)) {",
            "            const _expPotions = ['potion_exp150','potion_exp200','potion_exp300','potion_exp500','potion_exp_stage2','potion_exp_stage2_200','potion_exp_stage2_300','potion_exp_stage2_500'];",
            "            const _expPotion = _expPotions[Math.floor(Math.random() * _expPotions.length)];",
            "            if (DB.items[_expPotion]) { gainItem(_expPotion, 1); logSys(\"<span class='text-emerald-300 font-bold'>✦ 你從怪物身上拾起了隨機經驗藥水。</span>\"); }",
            '        }',
            '    }',
            ''
          ].join(String.fromCharCode(10));
          writeFileSync(dropPath, drops.slice(0, at) + extra + drops.slice(at));
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
